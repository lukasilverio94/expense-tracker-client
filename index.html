<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" defer src="app.js"></script>
  </head>
  <body class="bg-gray-100 font-sans">
    <nav class="bg-indigo-600 text-white p-4 text-center text-xl font-bold">
      Expense Tracker
    </nav>

    <main class="max-w-4xl mx-auto mt-6 p-4 bg-white rounded shadow">
      <section id="expense-form-section" class="mb-8">
        <h2 class="text-2xl font-semibold mb-4">Add Expense</h2>
        <form id="expense-form" class="grid gap-4 md:grid-cols-2">
          <input
            type="text"
            id="description"
            placeholder="Description"
            required
            class="p-2 border rounded w-full"
          />
          <input
            type="text"
            id="value"
            step="0.01"
            placeholder="Value"
            required
            class="p-2 border rounded w-full"
          />
          <input
            type="date"
            id="createdAt"
            required
            class="p-2 border rounded w-full"
          />
          <select id="category" required class="p-2 border rounded w-full">
            <option value="">Select Category</option>
          </select>
          <button
            type="submit"
            class="bg-indigo-600 text-white p-2 rounded hover:bg-indigo-700 w-full md:col-span-2"
          >
            Add Expense
          </button>
        </form>
      </section>

      <section id="expenses-list-section">
        <h2 class="text-2xl font-semibold mb-4">Expenses</h2>

        <!-- filter input -->
        <div class="relative w-full max-w-sm mb-4">
          <input
            type="text"
            id="filterDescription"
            placeholder="Search expenses..."
            class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200"
          />
          <svg
            class="w-5 h-5 absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-4.35-4.35M16.65 16.65A7.5 7.5 0 1116.65 2a7.5 7.5 0 010 15z"
            />
          </svg>
        </div>

        <!-- Delete Confirmation Modal -->
        <div
          id="delete-modal"
          class="fixed inset-0 flex items-center justify-center z-50 bg-white/30 hidden"
        >
          <div class="bg-white rounded-2xl p-6 shadow-xl w-full max-w-sm">
            <h2 class="text-lg font-semibold mb-4">Confirm Deletion</h2>
            <p class="text-sm text-gray-600 mb-6">
              Are you sure you want to delete this expense?
            </p>
            <div class="flex justify-end space-x-4">
              <button
                id="cancel-delete"
                class="px-4 py-2 rounded-md bg-gray-200 text-gray-700 hover:bg-gray-300"
              >
                Cancel
              </button>
              <button
                id="confirm-delete"
                class="px-4 py-2 rounded-md bg-red-600 text-white hover:bg-red-700"
              >
                Delete
              </button>
            </div>
          </div>
        </div>

        <!-- total expenses -->
        <div
          id="total-expense"
          class="text-xl font-bold text-right mb-4 text-indigo-500"
        >
          Total: €0.00
        </div>
        <!-- end total expenses -->
        <table class="w-full border-collapse">
          <thead>
            <tr class="bg-gray-200 text-left">
              <th class="p-2">Title</th>
              <th class="p-2">Amount</th>
              <th class="p-2">Date</th>
              <th class="p-2">Category</th>
              <th class="p-2">Actions</th>
            </tr>
          </thead>
          <tbody id="expenses-table-body"></tbody>
        </table>
      </section>
    </main>
  </body>
</html>
